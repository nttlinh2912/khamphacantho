spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/dia_diem_an_uong_can_tho?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=123456Linh#

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thư mục lưu hình ảnh quán ăn
app.upload.dir=uploads

# Giới hạn dung lượng mỗi ảnh: 10 MB
spring.servlet.multipart.max-file-size=10MB

# Giới hạn tổng dung lượng mỗi request: 50 MB
spring.servlet.multipart.max-request-size=50MB

# URL website frontend
app.seo.base-url=http://localhost:5173

app.seo.site-url=http://localhost:5173
app.seo.site-name=Địa điểm ăn uống Cần Thơ
app.seo.logo-url=http://localhost:8080/uploads/logo.png
app.seo.article-path=/bai-viet/